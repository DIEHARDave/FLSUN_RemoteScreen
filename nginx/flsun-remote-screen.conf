# FLSUN_RemoteScreen: the touchscreen at http://<printer>/screen/
# Included in Mainsail's server block by install.sh.

location = /screen {
    return 301 /screen/;
}

# Plain prefix (not ^~) so the regex location below wins for the API paths.
location /screen/ {
    alias /home/pi/FLSUN_RemoteScreen/html/;
    index index.html;
    add_header Cache-Control "no-cache";
}

# Screen contents and touches need the same access as Mainsail itself.
location ~ ^/screen/(snapshot|stream|touch|info)$ {
    auth_request /flsun_remote_screen_auth;
    proxy_pass http://127.0.0.1:8093/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600;
}

location = /flsun_remote_screen_auth {
    internal;
    proxy_pass http://apiserver/access/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    # Moonraker decides trusted clients by these; never pass the browser's own.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
